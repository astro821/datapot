services:
  datapot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: datapot:local
    ports:
      - "8080:8080"
      - "9001-9010:9001-9010"
    environment:
      DPOT_MODE: single
      DPOT_ADMIN_PASSWORD: datapot
      DPOT_DATA_DIR: /data
      DPOT_JWT_SECRET: change-me-in-production
    volumes:
      - dpot-data:/data

volumes:
  dpot-data:
