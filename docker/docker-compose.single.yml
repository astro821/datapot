services:
  mongo:
    image: mongo:7
    volumes:
      - dpot-mongo:/data/db
  datapot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: datapot:local
    ports:
      - "8080:8080"
      - "9001-9010:9001-9010"
    environment:
      DPOT_MODE: single
      DPOT_ADMIN_PASSWORD: datapot
      DPOT_DATA_DIR: /data
      DPOT_DB_TYPE: mongodb
      DPOT_DB_URL: mongodb://mongo:27017/datapot
      DPOT_JWT_SECRET: change-me-in-production
    depends_on:
      - mongo
    volumes:
      - dpot-data:/data

volumes:
  dpot-data:
  dpot-mongo:
